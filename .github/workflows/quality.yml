name: quality

on:
  push:
    branches: [main]
    # Tagi wydan MUSZA miec wlasny zielony przebieg — checklista wydania tego wymaga,
    # a workflow dotad startowal tylko na main, wiec punkt "CI zielone NA TAGU" byl
    # niesprawdzalny (v1.0.0: tag wskazuje commit zwalidowany na main, ale bez wlasnego biegu).
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # matryca: skladnia + testy jednostkowe na KAZDEJ wersji PHP (podloga 8.1 ze spec)
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '${{ matrix.php }}'
          tools: 'composer:v2'
      - run: composer install --prefer-dist --no-progress
      - name: Build kopii wspólnego kodu (includes/Common — generowane, gitignorowane)
        # Bez tego testy jednostkowe pracują na innym kształcie kodu niż produkcja:
        # klasy MP\<Plugin>\Common\* po prostu nie istnieją, więc każde odwołanie do
        # wspólnego helpera wywala się dopiero w CI (a lokalnie działa, bo build był).
        run: bash build/build.sh
      - name: Lint skladni
        run: find mp-service-intake mp-warranty-registry mp-workflow-automator lib -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: PHPUnit
        run: vendor/bin/phpunit

  # lint/static raz na 8.3 (zgodnosc wersji lapie PHPCompatibilityWP w phpcs)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: 'composer:v2'
      - run: composer install --prefer-dist --no-progress
      - name: Build kopii Common (PHPStan discovery symboli)
        run: bash build/build.sh
      # Podatnosci w zaleznosciach. Narzedzia deweloperskie tez sa celem ataku na
      # lancuch dostaw — chodza w CI z dostepem do repozytorium. Wtyczki klienta nie
      # maja zaleznosci produkcyjnych, a `vendor/` NIE wchodzi do paczki, wiec to
      # bramka dla NAS, nie dla klienta. Dolozone po wykryciu CVE-2026-45293
      # w WordPressCS 3.4.0 — recznie 28.07, bo CI tego wtedy nie sprawdzalo.
      - name: Podatnosci zaleznosci (composer audit)
        run: composer audit --no-interaction
      - name: PHPCS (czysty WPCS + PHPCompatibilityWP)
        run: vendor/bin/phpcs
      - name: PHPStan (lvl 6 + wordpress-stubs)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Liczby w dokumentach zgodne z kodem (uwaga zamawiającego 3x)
        run: bash testy/dokumenty/liczby-zgodne-z-kodem.sh
      - name: Linter cudzych tabel (tokenowy)
        run: php build/lint-cudze-tabele.php

  # artefakty: build ZIP-ow (stempel Common + BUILD-INFO + smoke z kopii)
  build-artefakty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Build (kopie Common, BUILD-INFO, ZIP, smoke)
        run: bash build/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mp-plugins-zip
          path: build/dist/*.zip

  # oficjalny Plugin Check — na ZBUDOWANYM artefakcie (runda W), per plugin
  plugin-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [mp-service-intake, mp-warranty-registry, mp-workflow-automator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Build artefaktu
        run: bash build/build.sh
      - uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1
        with:
          build-dir: './build/dist/${{ matrix.plugin }}'
          # outdated_tested_upto_header ZDJETY 27.07: paczka przeszla instalacje od zera
          #   na WP 7.0.2 (19/0 sciezka klienta, 6/0 panel), wiec "Tested up to: 7.0"
          #   jest prawda, a nie deklaracja — nagłowek pilnuje sie teraz sam.
          # load_plugin_textdomainFound: jezykiem ZRODLOWYM wtyczek jest polski (teksty w kodzie
          #   sa po polsku), a languages/ trzyma tylko szablon .pot — plikow .mo NIE MA i nie sa
          #   potrzebne. Wywolanie zostaje, zeby ktos mogl dolozyc wlasne tlumaczenie bez ruszania kodu.
          ignore-codes: 'PluginCheck.CodeAnalysis.DiscouragedFunctions.load_plugin_textdomainFound'

  # skan sekretow (maszyna; lokalny pre-commit to tylko pierwsza linia)
  gitleaks:
    runs-on: ubuntu-latest
    # W repo PRYWATNYM akcja musi odczytac liste commitow PR-a przez API
    # (GET /repos/.../pulls/N/commits). Samo `contents: read` daje 403
    # „Resource not accessible by integration" — w publicznym repo przechodzilo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # E2E DoD klocka B na ZYWYM WP (sygnal #1): import 10k, kill-polowa-wznowienie,
  # partia CSV->check, negatywne uprawnienia, snapshot-uninstall.
  e2e-import:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: mysqli, iconv, intl
          tools: wp-cli:2.12.0
      - name: Build pluginow (kopie Common)
        run: bash build/build.sh
      - name: Instalacja WP 6.9.4 (pin ze spec)
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=6.9.4
          wp config create --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          # URL == adres wbudowanego serwera (wp server) — front E2E bez 301 na canonical.
          wp core install --url=http://127.0.0.1:8080 --title=DoD --admin_user=admin \
            --admin_password=admin --admin_email=dod@example.com --skip-email
          cp -r "$GITHUB_WORKSPACE"/mp-service-intake "$GITHUB_WORKSPACE"/mp-warranty-registry \
            "$GITHUB_WORKSPACE"/mp-workflow-automator /tmp/wp/wp-content/plugins/
          # Przechwyt wp_mail (token magic-linka dla testu C3) — dev-only mu-plugin.
          mkdir -p /tmp/wp/wp-content/mu-plugins
          cp "$GITHUB_WORKSPACE"/docker/mu-plugins/mp-test-mail-capture.php /tmp/wp/wp-content/mu-plugins/
          wp plugin activate mp-service-intake mp-warranty-registry mp-workflow-automator
      - name: Testy C1 (rdzeń sprawy — SRV współbieżny + narodziny + snapshot z partią)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c1-rdzen.sh
      - name: Testy C2 (formularz dynamiczny + walidacje przed insertem)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c2-formularz.sh
      - name: Testy C3 (front — formularz, honeypot, magic-link, potwierdzenie)
        run: |
          cd /tmp/wp
          wp server --host=127.0.0.1 --port=8080 --docroot=/tmp/wp >/tmp/wp-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ -o /dev/null && break; sleep 1; done
          MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c3-front.sh
      - name: Testy C4 (załączniki twardo — finfo, EXIF-strip, deny-ALL, IDOR, retencja)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c4-zalaczniki.sh
      - name: Testy C5 (RODO — zgody, wiadomości, eraser/exporter, anonimizacja)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c5-rodo.sh
      - name: Testy C6a (konto mp_client + passwordless login + panel IDOR)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c6a-konto-panel.sh
      - name: Testy C6b (wiadomości na panelu — historia + wysyłka + IDOR + zamknięta)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c6b-wiadomosci.sh
      - name: Testy C6b-2a (edycja danych kontaktowych — art. 16)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c6b2-dane-kontaktowe.sh
      - name: Testy C6b-2b (wycofanie zgody + eraser + FLAGA #6 RODO)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c6b2b-wycofanie-zgody.sh
      - name: Testy C19 (wspólny e-mail — tożsamość osób + odmowa wycofania)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c19-wspolny-email.sh
      - name: Testy C20 (wyścig RODO — blokada wiersza + recheck + rollback)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c20-rodo-wyscig.sh
      - name: Testy C21 (dedup — atomowa rezerwacja vs równoległe POST-y)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c21-dedup-wyscig.sh
      - name: Testy C22 (indeks przydziału — migracja v3 + EXPLAIN)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c22-indeks-przydzialu.sh
      - name: Testy C23 (reconcile sierot weryfikacji — tick sweepa D→C)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c23-reconcile-sierota.sh
      - name: Testy C24 (diagnostyka cron — wykonanie, nie sam plan)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c24-diagnostyka-cron-wykonanie.sh
      - name: Testy C28 (RODO — eksport oddaje treści z formularza)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c28-eksport-rodo-kompletny.sh
      - name: Testy C27 (RODO — krok potwierdzenia przed usunięciem danych)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c27-rodo-potwierdzenie.sh
      - name: Testy nazw rodzaju i statusu (jedna sprawa = jedna nazwa)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-nazwy-rodzaju-i-statusu.sh
      - name: Testy dostępu ról do ekranów (koordynator nie mniej niż pracownik)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-dostep-rol-ekrany.sh
      - name: Testy śladu operacji (nieudany zapis dziennika zatrzymuje operację)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-slad-operacji-nie-ginie.sh
      - name: Testy drobnych napraw (nagłówki przy bloku, wersja schematu, zbędna praca)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c-drobne-2-52-2-59-2-61.sh
      - name: Testy CSV — raport błędów importu nie wypuszcza formuły
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-csv-formula-raport-bledow.sh
      - name: Testy warstwy ustawień (statusy, terminy, reguły, kasowanie danych)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-warstwa-ustawien.sh
      - name: Testy tożsamości konta klienta (konto WP bez danych osobowych)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c-tozsamosc-konta-klienta.sh
      - name: Testy RODO — zgłoszenia niepotwierdzone (usunięcie i wydanie danych)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-rodo-zgloszenia-niepotwierdzone.sh
      - name: Testy awarii poczty (klient i personel słyszą, że mail nie wyszedł)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c-2-1b-poczta-nie-milczy.sh
      - name: Testy ponowień powiadomień z reguł (poczta pada, mail nie ginie)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-2-12-ponowienia-powiadomien.sh
      - name: Testy C26 (widok zwrotu + etykiety zdarzeń i priorytetu)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c26-widok-zwrot-i-etykiety.sh
      - name: Testy C6c (ochrona zgłoszeń — rate-limit + dedup P1.6)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c6c-ochrona-zgloszen.sh
      - name: Testy formularz dynamiczny (#15 — render unii pól + config JS + submit każdego rodzaju)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c-form-dynamic.sh
      - name: Testy C-kategoria-formularz (P1.2 — pola formularza wg kategorii + zero regresji rodzaju)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-kategoria-formularz.sh
      - name: Testy C-zalaczniki-kategoria (P1.2 — wymog zalacznika wg kategorii + zero regresji audio i bez kategorii)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c-zalaczniki-kategoria.sh
      - name: Testy szlif Intake (#16 — pasek admina wg roli + CSS frontu + CTA do panelu)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c16-szlif.sh
      - name: Testy C17 rate-limit magic-link (5 przechodzi/6 blok, gate IP+email, konfigurowalne filtrem, anti-automation)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c17-rate-limit-login.sh
      - name: Testy C11 (wyjatek gwarancyjny B => EXCEPTION_APPLIED/REVOKED na osi C, NO-PII, global=no-op)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c11-exception-event.sh
      - name: Testy C7a (serial-reuse P2.3 — flaga possible_duplicate)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c7a-serial-reuse.sh
      - name: Testy C7b (admin unverified — capability + throttle + resend + negatywna macierz ról)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c7b-admin-unverified.sh
      - name: DoD §3 — security-sweep (macierz ról negatywna, wszystkie endpointy admina => 403)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/c-dod-security-matrix.sh
      - name: DoD §7 — a11y/WCAG (labelki + role=alert + aria-describedby na formularzach)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/a11y-forms.sh
      - name: Testy B-kategoria (kartka P1.2/P3.1 — kolumna category + slownik + parser + hak mp_product_category)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/b-kategoria.sh
      - name: Testy B5 (kartka l.50 — brak usuniecia produktu z aktywna sprawa; Archive + listener mp_product_active_cases_count)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/b5-usuwanie-produktu.sh
      - name: Testy edycji produktu (kartka — „historia zmian danych produktu"; diff w historii, PII poza logiem, serial nietykalny, status gwarancji reaguje)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/b-edycja-produktu.sh
      - name: Testy walidacji dat w imporcie (gwarancja przed zakupem odpada do raportu, dobry wiersz wchodzi, puste daty dalej legalne)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/b-import-waliduje-daty.sh
      - name: Testy mp_product_details (kontrakt B->C sekcja Produkt+Gwarancja na karcie — pola, status gwarancji z daty, archived, id=0/nieistniejacy=null)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/b-product-details.sh
      - name: Testy Registry maybe_upgrade (kartka T2 — auto-migracja przy update BEZ reaktywacji; regresja bug 24.07)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/registry-maybe-upgrade.sh
      - name: Testy listenery C->B (kolumna Sprawy mp_case_count_by_product + wyszukiwarka po kliencie mp_customer_find_products P2.6)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c-count-search-hooki.sh
      - name: Testy D1 (schemat Automatora — 4 tabele + append-only + idempotencja migracji)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d1-schema.sh
      - name: Testy C-hooki dla D (mp_case_get_context + mp_case_assign + CASE_ASSIGNED)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-hooki-c.sh
      - name: Testy P3.1 (silnik reguł + auto-przydział round-robin + ASSIGNMENT_UNMATCHED)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p31-przydzial.sh
      - name: Testy P3.1 wg KATEGORII (kartka — produkt->sprawa->get_context.kategoria->regula->przydzial)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p31-kategoria.sh
      - name: Testy przebieg krok 5 PRIORYTET (silnik reguł nadaje priorytet — akcja set_priority na case_created; niepasujaca=normal; SLA odzwierciedla priorytet; idempotencja+walidacja)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p31-priorytet.sh
      - name: Testy P3.2 (mp_case_change_status — STATE_MACHINE + optimistic-lock + reopen)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p32-status.sh
      - name: Testy P3.2 D-side (statusy własne — filtr mp_registered_statuses + guard długości + round-trip)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p32b-statusy-d.sh
      - name: Testy P3.2 guard pętli (reguły A↔B → RULE_LOOP_BLOCKED, mutacja depth>=1 zablokowana, zero lawiny)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p32c-guard-petli.sh
      - name: Testy P3.3 maile (notify klient — render markerów, sanityzacja odbiorcy, NO-PII, MAIL_SKIPPED, mail z depth1)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p33-maile.sh
      - name: Testy P3.3 notyfikacja przydziału (hook mp_case_assigned — każdy przydział→mail agenta, bulletproof, NO-PII)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p33b-assign-notify.sh
      - name: Testy P3.3 mail do PRACOWNIKA przy zmianie statusu (spec „klient i pracownik" — przypisany agent dostaje mail; SELF-SKIP gdy sam zmienił, recipient_ref=agent_self)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p33e-mail-pracownik.sh
      - name: Testy P3.3 reguły wiadomości (message_added — klient→agent, staff→klient, system=nic, guard from===to)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p33c-message.sh
      - name: Testy P3.3 dedup-okno (identyczny mail w oknie → MAIL_DEDUPED; różna treść przechodzi; okna per typ)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p33d-dedup.sh
      - name: Testy P3.4 SLA-1 księga (wiersz na created + reprovision + terminal→NULL + warning 25% + notify send-then-claim + SLA_* na osi C)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-p34a-sla-ksiega.sh
