name: quality

on:
  push:
    branches: [main]
    # Tagi wydan MUSZA miec wlasny zielony przebieg — checklista wydania tego wymaga,
    # a workflow dotad startowal tylko na main, wiec punkt "CI zielone NA TAGU" byl
    # niesprawdzalny (v1.0.0: tag wskazuje commit zwalidowany na main, ale bez wlasnego biegu).
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # matryca: skladnia + testy jednostkowe na KAZDEJ wersji PHP (podloga 8.1 ze spec)
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '${{ matrix.php }}'
          tools: 'composer:v2'
      - run: composer install --prefer-dist --no-progress
      - name: Build kopii wspólnego kodu (includes/Common — generowane, gitignorowane)
        # Bez tego testy jednostkowe pracują na innym kształcie kodu niż produkcja:
        # klasy MP\<Plugin>\Common\* po prostu nie istnieją, więc każde odwołanie do
        # wspólnego helpera wywala się dopiero w CI (a lokalnie działa, bo build był).
        run: bash build/build.sh
      - name: Lint skladni
        run: find mp-service-intake mp-warranty-registry mp-workflow-automator lib -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: PHPUnit
        run: vendor/bin/phpunit

  # lint/static raz na 8.3 (zgodnosc wersji lapie PHPCompatibilityWP w phpcs)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: 'composer:v2'
      - run: composer install --prefer-dist --no-progress
      - name: Build kopii Common (PHPStan discovery symboli)
        run: bash build/build.sh
      # Podatnosci w zaleznosciach. Narzedzia deweloperskie tez sa celem ataku na
      # lancuch dostaw — chodza w CI z dostepem do repozytorium. Wtyczki klienta nie
      # maja zaleznosci produkcyjnych, a `vendor/` NIE wchodzi do paczki, wiec to
      # bramka dla NAS, nie dla klienta. Dolozone po wykryciu CVE-2026-45293
      # w WordPressCS 3.4.0 — recznie 28.07, bo CI tego wtedy nie sprawdzalo.
      - name: Podatnosci zaleznosci (composer audit)
        run: composer audit --no-interaction
      - name: PHPCS (czysty WPCS + PHPCompatibilityWP)
        run: vendor/bin/phpcs
      - name: PHPStan (lvl 6 + wordpress-stubs)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Liczby w dokumentach zgodne z kodem (uwaga zamawiającego 3x)
        run: bash testy/dokumenty/liczby-zgodne-z-kodem.sh
      # Kontrakt i model bezpieczenstwa opisuja TEN kod, ktory jest (audyt 2.32/2.33/2.48).
      # Kontrola zaczepow idzie w OBIE strony — samo „z kodu do dokumentu" przepuscilo dwa widma.
      - name: Kontrakt i SECURITY zgodne z kodem (zero zaczepów-widm)
        run: bash testy/dokumenty/kontrakt-i-bezpieczenstwo-zgodne-z-kodem.sh
      # Wersja wtyczki w naglowku, stalej, readme.txt i .pot musi byc TA SAMA.
      # Ta sama klasa bledu zlapana dwa razy przypadkiem: .pot na 0.5.0 przy
      # wtyczkach 1.3.11 (#253), potem .pot na 1.3.11 przy wtyczkach 1.3.12.
      - name: Wersje zgodne we wszystkich czterech źródłach (3 wtyczki × 3 pary)
        run: bash testy/dokumenty/wersje-zgodne-z-wtyczkami.sh
      - name: Linter cudzych tabel (tokenowy)
        run: php build/lint-cudze-tabele.php

  # artefakty: build ZIP-ow (stempel Common + BUILD-INFO + smoke z kopii)
  build-artefakty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Build (kopie Common, BUILD-INFO, ZIP, smoke)
        run: bash build/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mp-plugins-zip
          path: build/dist/*.zip

  # oficjalny Plugin Check — na ZBUDOWANYM artefakcie (runda W), per plugin
  plugin-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [mp-service-intake, mp-warranty-registry, mp-workflow-automator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Build artefaktu
        run: bash build/build.sh
      - uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1
        with:
          build-dir: './build/dist/${{ matrix.plugin }}'
          # outdated_tested_upto_header ZDJETY 27.07: paczka przeszla instalacje od zera
          #   na WP 7.0.2 (19/0 sciezka klienta, 6/0 panel), wiec "Tested up to: 7.0"
          #   jest prawda, a nie deklaracja — nagłowek pilnuje sie teraz sam.
          # load_plugin_textdomainFound: jezykiem ZRODLOWYM wtyczek jest polski (teksty w kodzie
          #   sa po polsku), a languages/ trzyma tylko szablon .pot — plikow .mo NIE MA i nie sa
          #   potrzebne. Wywolanie zostaje, zeby ktos mogl dolozyc wlasne tlumaczenie bez ruszania kodu.
          ignore-codes: 'PluginCheck.CodeAnalysis.DiscouragedFunctions.load_plugin_textdomainFound'

  # skan sekretow (maszyna; lokalny pre-commit to tylko pierwsza linia)
  gitleaks:
    runs-on: ubuntu-latest
    # W repo PRYWATNYM akcja musi odczytac liste commitow PR-a przez API
    # (GET /repos/.../pulls/N/commits). Samo `contents: read` daje 403
    # „Resource not accessible by integration" — w publicznym repo przechodzilo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # E2E kryteria odbioru modułu B na ZYWYM WP (sygnal #1): import 10k, kill-polowa-wznowienie,
  # partia CSV->check, negatywne uprawnienia, snapshot-uninstall.
  e2e-import:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: mysqli, iconv, intl
          tools: wp-cli:2.12.0
      - name: Build pluginow (kopie Common)
        run: bash build/build.sh
      - name: Instalacja WP 6.9.4 (pin ze spec)
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=6.9.4
          wp config create --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          # URL == adres wbudowanego serwera (wp server) — front E2E bez 301 na canonical.
          wp core install --url=http://127.0.0.1:8080 --title=Odbior --admin_user=admin \
            --admin_password=admin --admin_email=dod@example.com --skip-email
          cp -r "$GITHUB_WORKSPACE"/mp-service-intake "$GITHUB_WORKSPACE"/mp-warranty-registry \
            "$GITHUB_WORKSPACE"/mp-workflow-automator /tmp/wp/wp-content/plugins/
          # Przechwyt wp_mail (token magic-linka dla testu C3) — dev-only mu-plugin.
          mkdir -p /tmp/wp/wp-content/mu-plugins
          cp "$GITHUB_WORKSPACE"/docker/mu-plugins/mp-test-mail-capture.php /tmp/wp/wp-content/mu-plugins/
          wp plugin activate mp-service-intake mp-warranty-registry mp-workflow-automator
      # ⛔ SERWER MUSI WSTAC PRZED TESTAMI HTTP. Wczesniej stawial go krok „Testy C3”,
      # jakby przy okazji — a gdy 94 kroki zastapilem jednym, front przestal istniec
      # i 18 testow padlo naraz (zlapane przez CI przed scaleniem). Teraz to WLASNY krok,
      # ktory JAWNIE sprawdza, czy serwer odpowiada: cichy brak frontu wyglada jak awaria
      # produktu, a jest awaria srodowiska.
      - name: Wbudowany serwer WordPressa (front dla testów HTTP)
        run: |
          cd /tmp/wp
          wp server --host=127.0.0.1 --port=8080 --docroot=/tmp/wp >/tmp/wp-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ -o /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ -o /dev/null || { echo "⛔ Wbudowany serwer NIE WSTAL — testy HTTP nie mialyby sie do czego polaczyc."; tail -20 /tmp/wp-server.log; exit 1; }
          echo "✔ Front odpowiada na http://127.0.0.1:8080/"
      # ⛔ JEDEN KROK ZAMIAST 94 WPISANYCH RECZNIE. Kazdy nowy test byl dopisywany
      # w to samo miejsce tej listy, wiec dwie galezie robione rownolegle ZAWSZE
      # konfliktowaly w tym pliku — a zle rozwiazany konflikt po cichu wyrzucal cudzy
      # test z przebiegu. Do tego test napisany i niewpiety nie chodzil nigdzie.
      # Teraz: dodanie testu = dodanie PLIKU w testy/e2e/. Kolejnosc dotychczasowa
      # zachowana co do pliku (testy/e2e/KOLEJNOSC.txt), nowe doklejaja sie na koncu.
      - name: Testy e2e (automatyczne wykrywanie — cały zestaw)
        run: cd /tmp/wp && MP_BASE=http://127.0.0.1:8080 bash "$GITHUB_WORKSPACE"/testy/e2e/uruchom-wszystkie.sh

  # kryteria odbioru C sekcja 4 — brudny WP: niestandardowy prefiks + WP_DEBUG + object-cache + degraded-order
  dirty-env:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: mysqli, iconv, intl
          tools: wp-cli:2.12.0
      - name: Build pluginow (kopie Common)
        run: bash build/build.sh
      - name: Instalacja WP — NIESTANDARDOWY prefiks + WP_DEBUG + object-cache
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=6.9.4
          wp config create --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1 --dbprefix=cms_x9_
          wp config set WP_DEBUG true --raw --type=constant
          wp config set WP_DEBUG_LOG true --raw --type=constant
          wp config set WP_DEBUG_DISPLAY false --raw --type=constant
          wp core install --url=http://127.0.0.1:8080 --title=Dirty --admin_user=admin \
            --admin_password=admin --admin_email=dirty@example.com --skip-email
          cp -r "$GITHUB_WORKSPACE"/mp-service-intake "$GITHUB_WORKSPACE"/mp-warranty-registry \
            "$GITHUB_WORKSPACE"/mp-workflow-automator /tmp/wp/wp-content/plugins/
          # persistent object-cache ON (drop-in testowy)
          cp "$GITHUB_WORKSPACE"/testy/fixtures/object-cache.php /tmp/wp/wp-content/object-cache.php
          wp plugin activate mp-service-intake mp-warranty-registry mp-workflow-automator
      - name: Dirty-env test (prefiks + WP_DEBUG zero-notice + object-cache + degraded)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/dirty-env.sh
      - name: kryteria odbioru D na dirty-env (uninstall zero-śladu + degraded pod cms_x9_ + object-cache + WP_DEBUG zero-notice)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/d-dod.sh

  # kryteria odbioru C sekcja 5 — MIGRACJA v0.2.0 -> v0.3.0 z realnymi danymi (upgrade bez reaktywacji)
  migration:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: mysqli, iconv, intl
          tools: wp-cli:2.12.0
      - name: Build v0.3.0 (glowny working tree — kopie Common)
        run: bash build/build.sh
      - name: Przygotuj v0.2.0 (worktree z tagu + build kopii Common)
        run: |
          git worktree add /tmp/v020 v0.2.0
          cd /tmp/v020 && bash build/build.sh
      - name: Instalacja WP 6.9.4
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=6.9.4
          wp config create --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          wp core install --url=http://127.0.0.1:8080 --title=Mig --admin_user=admin \
            --admin_password=admin --admin_email=mig@example.com --skip-email
      - name: Test migracji v0.2.0 -> v0.3.0 (dane+schemat+cron+role+opcje)
        run: cd /tmp/wp && V020_SRC=/tmp/v020 V030_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE"/testy/e2e/migration.sh

  # kryteria odbioru C sekcja 4 — SILNIK BAZY: spec klienta wymienia MySQL 8 ORAZ MariaDB 10.6+,
  # a caly pakiet testowaliśmy dotad WYLACZNIE na MariaDB. Ten przebieg dowodzi, ze
  # schemat, migracje i pelna sciezka zgloszenia dzialaja takze na MySQL 8 (inny
  # domyslny sql_mode, inne traktowanie DEFAULT i collation).
  mysql8:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: mysqli, iconv, intl
          tools: wp-cli:2.12.0
      - name: Build pluginow (kopie Common)
        run: bash build/build.sh
      - name: Instalacja WP 6.9.4 na MySQL 8
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=6.9.4
          wp config create --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          wp core install --url=http://127.0.0.1:8080 --title=MySQL8 --admin_user=admin \
            --admin_password=admin --admin_email=mysql8@example.com --skip-email
          cp -r "$GITHUB_WORKSPACE"/mp-service-intake "$GITHUB_WORKSPACE"/mp-warranty-registry \
            "$GITHUB_WORKSPACE"/mp-workflow-automator /tmp/wp/wp-content/plugins/
          wp plugin activate mp-service-intake mp-warranty-registry mp-workflow-automator
      - name: Silnik bazy to naprawde MySQL (nie MariaDB)
        run: |
          cd /tmp/wp
          WERSJA=$(wp db query "SELECT VERSION()" --skip-column-names)
          echo "silnik: $WERSJA"
          echo "$WERSJA" | grep -qi "mariadb" && { echo "BLAD: to MariaDB, nie MySQL"; exit 1; } || true
          echo "$WERSJA" | grep -q "^8\." || { echo "BLAD: oczekiwano MySQL 8.x"; exit 1; }
      - name: Wszystkie 16 tabel powstalo (schemat przeszedl na MySQL 8)
        run: |
          cd /tmp/wp
          ILE=$(wp db query "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='wordpress' AND table_name LIKE 'wp_mp_%'" --skip-column-names)
          echo "tabel MP: $ILE"
          [ "$ILE" = "16" ] || { echo "BLAD: oczekiwano 16 tabel, jest $ILE"; exit 1; }
      - name: Testy C1 (rdzen sprawy — numer SRV, narodziny, snapshot)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c1-rdzen.sh
      - name: Testy C5 (RODO — zgody, eraser, anonimizacja)
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/c5-rodo.sh
      - name: kryteria odbioru import + uninstall bez sladu na MySQL 8
        run: cd /tmp/wp && bash "$GITHUB_WORKSPACE"/testy/e2e/import-dod.sh

  # kryteria odbioru C sekcja 6 — RELEASE-SMOKE: testuj ARTEFAKT (ZIP), nie katalog dev
  release-smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: mysqli, iconv, intl
          tools: wp-cli:2.12.0
      - name: Build ZIP-y (artefakt z build.sh)
        run: bash build/build.sh
      - name: Instalacja WP 6.9.4 + WP_DEBUG
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=6.9.4
          wp config create --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          wp config set WP_DEBUG true --raw --type=constant
          wp config set WP_DEBUG_LOG true --raw --type=constant
          wp config set WP_DEBUG_DISPLAY false --raw --type=constant
          wp core install --url=http://127.0.0.1:8080 --title=Rel --admin_user=admin \
            --admin_password=admin --admin_email=rel@example.com --skip-email
      - name: Release-smoke na ZIP (install z artefaktu + WP_DEBUG + uninstall grep-zero)
        run: cd /tmp/wp && DIST_DIR="$GITHUB_WORKSPACE/build/dist" bash "$GITHUB_WORKSPACE"/testy/e2e/release-smoke.sh
